name: Userinterface CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "userinterface/**"
      - ".github/workflows/userinterface-ci.yml"
  push:
    branches:
      - main
      - in-dev-v1
    paths:
      - "userinterface/**"
      - ".github/workflows/userinterface-ci.yml"

permissions:
  contents: read

concurrency:
  group: userinterface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    defaults:
      run:
        working-directory: userinterface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production application
        run: pnpm build
