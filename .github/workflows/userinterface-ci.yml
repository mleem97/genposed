name: Userinterface CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "userinterface/**"
      - ".github/workflows/userinterface-ci.yml"
  push:
    branches:
      - main
      - in-dev-v1
    paths:
      - "userinterface/**"
      - ".github/workflows/userinterface-ci.yml"

permissions:
  contents: read

concurrency:
  group: userinterface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    defaults:
      run:
        working-directory: userinterface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run verification and capture output
        id: verify
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@11.15.1 --activate
            node --version
            pnpm --version
            pnpm install --no-frozen-lockfile
            pnpm typecheck
            pnpm build
          ) 2>&1 | tee ci.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userinterface-ci-log-${{ github.run_id }}
          path: userinterface/ci.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when verification failed
        if: steps.verify.outputs.status != '0'
        run: |
          echo "Userinterface verification failed with exit code ${{ steps.verify.outputs.status }}."
          exit 1
